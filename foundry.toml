[profile.default]
optimizer = true
optimizer_runs = 200
src = 'src'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
cache_path  = 'cache_forge'
fs_permissions = [{ access = "read", path = "./out"}]
remappings = [
    '@othentic/=src/',
    '@layerzerolabs/lz-evm-protocol-v2/=lib/LayerZero-v2/protocol/',
    '@layerzerolabs/lz-evm-oapp-v2/=lib/LayerZero-v2/oapp/',
    '@layerzerolabs/lz-evm-messagelib-v2/=lib/LayerZero-v2/messagelib/',
    'solidity-bytes-utils/contracts/=src/lz/util/',
]

ignored_warnings_from = ["lib/core/src/contracts/common/MigratableEntityProxy.sol", "test/mocks/AttestationCenterMock.sol"]
evm_version = 'paris'

[fmt]
bracket_spacing = false
int_types = "long"
line_length = 120
multiline_func_header = "attributes_first"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
ignore = ["src/lz/**/*.sol"]